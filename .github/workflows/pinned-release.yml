name: Pinned rc.1 release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-release.txt
      - name: Regression and fault-injection tests
        run: |
          mkdir -p diagnostics
          python -m unittest discover -s tests -v 2>&1 | tee diagnostics/unit-tests.log
      - name: Fetch workspace release manifest from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openAMRobot/openamrobot-manifest
          ref: main
          path: manifest-reference
          persist-credentials: false
      - name: Reject release manifest drift
        run: |
          mkdir -p diagnostics
          python scripts/check_manifest_sync.py manifests/v2.0.0-rc.1.repos manifest-reference/releases/v2.0.0-rc.1.repos 2>&1 | tee diagnostics/manifest-parity.log
      - name: First independent fetch and build
        run: |
          mkdir -p diagnostics
          python scripts/build_release.py --config release-config.rc1.json --input-dir input/first --output-dir dist/first --fetch 2>&1 | tee diagnostics/first-build.log
      - name: Second independent fetch and build
        run: |
          mkdir -p diagnostics
          python scripts/build_release.py --config release-config.rc1.json --input-dir input/second --output-dir dist/second --fetch 2>&1 | tee diagnostics/second-build.log
      - name: Verify integrity and reproducibility
        run: |
          mkdir -p diagnostics
          exec > >(tee diagnostics/integrity.log) 2>&1
          python scripts/validate_release.py dist/first/OpenAMRobot-v2.0.0-rc.1-source.zip
          python scripts/validate_release.py dist/second/OpenAMRobot-v2.0.0-rc.1-source.zip
          cmp dist/first/OpenAMRobot-v2.0.0-rc.1-source.zip dist/second/OpenAMRobot-v2.0.0-rc.1-source.zip
          (cd dist/first && sha256sum -c OpenAMRobot-v2.0.0-rc.1-source.zip.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenAMRobot-v2.0.0-rc.1-candidate
          path: dist/first/
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc1-build-diagnostics
          path: |
            diagnostics/
            release-config*.json
            manifests/*.repos
            manifest-reference/releases/v2.0.0-rc.1.repos
            dist/**/*.sha256
          if-no-files-found: warn
