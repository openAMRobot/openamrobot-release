name: Pinned rc.1 release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-release.txt
      - name: Regression and fault-injection tests
        run: python -m unittest discover -s tests -v
      - name: Fetch workspace release manifest from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openAMRobot/openamrobot-manifest
          ref: main
          path: manifest-reference
          persist-credentials: false
      - name: Reject release manifest drift
        run: python scripts/check_manifest_sync.py manifests/v2.0.0-rc.1.repos manifest-reference/releases/v2.0.0-rc.1.repos
      - name: First independent fetch and build
        run: python scripts/build_release.py --config release-config.rc1.json --input-dir input/first --output-dir dist/first --fetch
      - name: Second independent fetch and build
        run: python scripts/build_release.py --config release-config.rc1.json --input-dir input/second --output-dir dist/second --fetch
      - name: Verify integrity and reproducibility
        run: |
          python scripts/validate_release.py dist/first/OpenAMRobot-v2.0.0-rc.1-source.zip
          python scripts/validate_release.py dist/second/OpenAMRobot-v2.0.0-rc.1-source.zip
          cmp dist/first/OpenAMRobot-v2.0.0-rc.1-source.zip dist/second/OpenAMRobot-v2.0.0-rc.1-source.zip
          (cd dist/first && sha256sum -c OpenAMRobot-v2.0.0-rc.1-source.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAMRobot-v2.0.0-rc.1-candidate
          path: dist/first/
